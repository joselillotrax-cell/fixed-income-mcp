[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bondmath"
version = "0.1.0"
description = "Fixed-income analytics that cross-check their own work"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "José Navarro" }]
keywords = ["fixed-income", "bonds", "duration", "convexity", "finance"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Financial and Insurance Industry",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Office/Business :: Financial",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.urls]
Homepage = "https://github.com/joselillotrax-cell/fixed-income-mcp"

[tool.hatch.build.targets.wheel]
packages = ["src/bondmath"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--doctest-modules"
