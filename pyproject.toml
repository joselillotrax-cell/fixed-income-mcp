[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bondmath"
version = "0.1.2"
description = "Fixed-income analytics that cross-check their own work"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "José Navarro" }]
keywords = ["fixed-income", "bonds", "duration", "convexity", "finance", "mcp"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Financial and Insurance Industry",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Office/Business :: Financial",
]
# bondmath.bond/.pricing/.analytics/.checks/.daycount/.schedule are pure
# standard library. mcp is required at the package level, not left optional,
# because the MCP registry's own publish validator resolves `identifier`
# against PyPI by exact project name and rejects a name that includes an
# extras qualifier like "bondmath[mcp]" — so there is no way to publish an
# MCP-registry listing for an extras-gated dependency. A plain `pip install
# bondmath` or `uvx bondmath` must be enough to run the server.
dependencies = ["mcp>=2.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "anyio>=4.0"]

[project.scripts]
fixed-income-mcp = "bondmath.server:main"
bondmath = "bondmath.server:main"

[project.urls]
Homepage = "https://github.com/joselillotrax-cell/fixed-income-mcp"
Source = "https://github.com/joselillotrax-cell/fixed-income-mcp"

[tool.hatch.build.targets.wheel]
packages = ["src/bondmath"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--doctest-modules"
