[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bondmath"
version = "0.1.1"
description = "Fixed-income analytics that cross-check their own work"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "José Navarro" }]
keywords = ["fixed-income", "bonds", "duration", "convexity", "finance", "mcp"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Financial and Insurance Industry",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Office/Business :: Financial",
]
# The analytics core has no dependencies. The MCP server layer needs the SDK,
# which is why it sits behind an extra: `pip install bondmath` gives you the
# library alone, `pip install bondmath[mcp]` adds the server.
dependencies = []

[project.optional-dependencies]
mcp = ["mcp>=2.0"]
dev = ["pytest>=8.0", "anyio>=4.0", "mcp>=2.0"]

[project.scripts]
fixed-income-mcp = "bondmath.server:main"
bondmath = "bondmath.server:main"

[project.urls]
Homepage = "https://github.com/joselillotrax-cell/fixed-income-mcp"
Source = "https://github.com/joselillotrax-cell/fixed-income-mcp"

[tool.hatch.build.targets.wheel]
packages = ["src/bondmath"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--doctest-modules"
